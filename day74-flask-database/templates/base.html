<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Flask DB App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/">🏠 Home</a>
            <a href="/users">👥 Users</a>
            <a href="/posts">📝 Posts</a>
        </div>
        <div class="nav-right">
            <a href="/user/add" class="btn-nav">➕ Add User</a>
            <a href="/post/add" class="btn-nav">➕ Add Post</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; {{ now.year }} Flask Database App</p>
    </footer>
</body>
</html>
