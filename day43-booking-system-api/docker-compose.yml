services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: day43_api
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: day43_redis
    ports:
      - "6379:6379"