<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - 90 Days Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Portfolio</div>
            <ul>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#experience">Experience</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>90 Days of Python</h1>
            <p>A journey from basics to full-stack development</p>
            <div class="stats" id="stats">
                <div class="stat-item">
                    <span class="stat-number" id="project-count">0</span>
                    <span class="stat-label">Projects</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="skill-count">0</span>
                    <span class="stat-label">Skills</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="experience-count">0</span>
                    <span class="stat-label">Experiences</span>
                </div>
            </div>
        </div>
    </section>

    <section id="projects" class="section">
        <h2>Projects</h2>
        <div class="projects-grid" id="projects-container"></div>
    </section>

    <section id="skills" class="section">
        <h2>Skills</h2>
        <div class="skills-container" id="skills-container"></div>
    </section>

    <section id="experience" class="section">
        <h2>Experience</h2>
        <div class="experience-container" id="experience-container"></div>
    </section>

    <footer>
        <p>&copy; 2026 - 90 Days Python Challenge</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
