services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: day42_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@postgres:5432/task_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key
      DEBUG: True
    volumes:
      - ..:/code
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: day42_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: day42_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
